version: "3.8"

services:

  ollama:
    image: ollama/ollama:latest
    container_name: intellirag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: intellirag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: intellirag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intellirag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intellirag_secret}
      POSTGRES_DB: ${POSTGRES_DB:-intellirag}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: intellirag-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-intellirag}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-intellirag_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intellirag-backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - DATABASE_URL=postgresql+asyncpg://intellirag:intellirag_secret@postgres:5432/intellirag
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-intellirag}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-intellirag_secret}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-32chars!!}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
    depends_on:
      - qdrant
      - postgres
      - minio
      - ollama
    restart: on-failure
    volumes:
      - /Users:/Users:ro
      - /tmp:/tmp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intellirag-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  model-init:
    image: ollama/ollama:latest
    container_name: intellirag-model-init
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
        sleep 10 &&
        ollama pull llama3.2 &&
        ollama pull nomic-embed-text &&
        echo 'Models ready'
      "
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

volumes:
  ollama_data:
  qdrant_data:
  postgres_data:
  minio_data:
